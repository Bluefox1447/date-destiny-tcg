{% extends 'base.html' %}{% block title %}เข้าสู่ระบบ{% endblock %}
{% block content %}
<div class="auth box hex">
  <h2>เข้าสู่ระบบ</h2>
  <form method="post">
    <label class="f"><span>ชื่อผู้ใช้</span><input name="username" required autofocus autocomplete="username"></label>
    <label class="f"><span>รหัสผ่าน</span><input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn pri" style="width:100%;justify-content:center">เข้าสู่ระบบ</button>
  </form>
  {% if social %}<div class="sep">หรือ</div>
  <div class="row">
    {% if 'google' in social %}<a class="btn grow" style="justify-content:center" href="{{ url_for('oauth_login', provider='google') }}">Google</a>{% endif %}
    {% if 'discord' in social %}<a class="btn grow" style="justify-content:center" href="{{ url_for('oauth_login', provider='discord') }}">Discord</a>{% endif %}
  </div>{% endif %}
  <p class="mut mt">ยังไม่มีบัญชี? <a href="{{ url_for('register') }}">สมัครสมาชิก</a></p>
</div>
{% endblock %}
