services:
  - type: web
    name: date-destiny-tcg
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k gthread --threads 100 -w 1 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_CLAIM_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false               # ใส่ค่าเองใน Render Dashboard (connection string ของ Supabase)
      - key: UPLOADS_IN_DB
        value: "1"
      - key: DECK_SIZE
        value: "50"
      - key: MAX_COPIES
        value: "4"